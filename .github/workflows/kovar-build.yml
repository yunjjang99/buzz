name: Kovar unsigned candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/kovar-ci.yml
  build:
    if: github.repository == 'yunjjang99/buzz'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: web
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616
        if: runner.os != 'Windows'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: runner.os == 'Windows'
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: runner.os == 'Windows'
        with:
          version: 11.4.0
      - run: pnpm install --frozen-lockfile
      - name: Native Rust target
        if: matrix.target != 'web'
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kovar-*-${{ github.sha }}
          path: ${{ runner.temp }}/kovar-evidence
      - name: Build Kovar only, require exact-source UI and real-relay evidence
        env:
          TARGET: ${{ matrix.target }}
        run: |
          node desktop/korean/update/build.mjs --target "$TARGET" \
            --ui-report "$RUNNER_TEMP/kovar-evidence/kovar-ui-$GITHUB_SHA/validation.json" \
            --relay-report "$RUNNER_TEMP/kovar-evidence/kovar-relay-$GITHUB_SHA/validation.json" \
            --output "$RUNNER_TEMP/kovar-candidate"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: kovar-${{ matrix.target }}-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/kovar-candidate
          if-no-files-found: error
          retention-days: 30
